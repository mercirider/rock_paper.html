<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✊✋✌️ Rock Paper Scissors</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0a0a1a;
    position: relative;
    padding: 16px;
  }

  /* Background glow */
  body::before,
  body::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.45;
    z-index: 0;
  }

  body::before {
    width: 420px;
    height: 420px;
    background: #06b6d4;
    top: -120px;
    left: -120px;
    animation: float1 9s ease-in-out infinite;
  }

  body::after {
    width: 420px;
    height: 420px;
    background: #a855f7;
    bottom: -120px;
    right: -120px;
    animation: float2 11s ease-in-out infinite;
  }

  @keyframes float1 {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(60px, 40px); }
  }

  @keyframes float2 {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(-60px, -40px); }
  }

  /* Main container */
  .game-container {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 26px;
    padding: 28px 30px;
    width: 100%;
    max-width: 620px;
    max-height: calc(100vh - 32px);
    overflow: hidden;
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
    text-align: center;
    animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes cardIn {
    from { transform: translateY(30px) scale(0.96); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }

  /* Title */
  .title {
    font-size: 32px;
    font-weight: 900;
    background: linear-gradient(135deg, #22d3ee, #a855f7, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }

  .subtitle {
    color: rgba(255, 255, 255, 0.55);
    font-size: 13px;
    margin-bottom: 20px;
    font-weight: 500;
  }

  /* Scoreboard */
  .scoreboard {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }

  .score-box {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    padding: 12px 6px;
    transition: all 0.3s;
  }

  .score-box.active {
    background: rgba(102, 126, 234, 0.2);
    border-color: rgba(102, 126, 234, 0.6);
    box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
  }

  .score-label {
    color: rgba(255, 255, 255, 0.5);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    font-weight: 700;
    margin-bottom: 5px;
  }

  .score-value {
    color: #fff;
    font-size: 26px;
    font-weight: 800;
  }

  .score-value.you   { color: #34d399; }
  .score-value.comp  { color: #f87171; }
  .score-value.draw  { color: #fbbf24; }

  /* Arena (both picks) */
  .arena {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 15px;
    margin-bottom: 22px;
    padding: 18px 10px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
  }

  .pick-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .pick-label {
    color: rgba(255, 255, 255, 0.55);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 700;
  }

  .pick-display {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.06);
    border: 2px dashed rgba(255, 255, 255, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .pick-display.filled {
    border-style: solid;
    border-color: rgba(255, 255, 255, 0.4);
    background: rgba(255, 255, 255, 0.1);
  }

  .pick-display.win {
    border-color: #34d399;
    background: rgba(52, 211, 153, 0.15);
    box-shadow: 0 0 30px rgba(52, 211, 153, 0.5);
    animation: winPulse 0.6s ease infinite alternate;
  }

  .pick-display.lose {
    border-color: #f87171;
    background: rgba(248, 113, 113, 0.15);
  }

  @keyframes winPulse {
    from { transform: scale(1); }
    to   { transform: scale(1.1); }
  }

  .vs {
    font-size: 22px;
    font-weight: 900;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 2px;
  }

  /* Result message */
  .result-message {
    min-height: 55px;
    padding: 14px 18px;
    border-radius: 16px;
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 18px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.35s;
    line-height: 1.4;
  }

  .result-message.win {
    background: rgba(52, 211, 153, 0.15);
    border-color: rgba(52, 211, 153, 0.5);
    color: #34d399;
    animation: pop 0.5s;
  }

  .result-message.lose {
    background: rgba(248, 113, 113, 0.15);
    border-color: rgba(248, 113, 113, 0.5);
    color: #f87171;
    animation: pop 0.5s;
  }

  .result-message.draw {
    background: rgba(251, 191, 36, 0.15);
    border-color: rgba(251, 191, 36, 0.5);
    color: #fbbf24;
    animation: pop 0.5s;
  }

  @keyframes pop {
    0%   { transform: scale(0.85); }
    50%  { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  /* Choice buttons */
  .choices {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }

  .choice-btn {
    padding: 18px 10px;
    border: 2px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.05);
    border-radius: 18px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    color: #fff;
  }

  .choice-btn .emoji {
    font-size: 36px;
    line-height: 1;
  }

  .choice-btn .label {
    font-size: 12px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.75);
    letter-spacing: 0.5px;
  }

  .choice-btn:hover:not(:disabled) {
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.3), rgba(118, 75, 162, 0.3));
    border-color: #667eea;
    transform: translateY(-5px);
    box-shadow: 0 15px 30px rgba(102, 126, 234, 0.35);
  }

  .choice-btn:active:not(:disabled) {
    transform: translateY(-2px) scale(0.97);
  }

  .choice-btn:disabled {
    cursor: not-allowed;
    opacity: 0.4;
  }

  /* Reset button */
  .reset-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #06b6d4, #a855f7);
    color: #fff;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 0.5px;
    box-shadow: 0 10px 25px rgba(168, 85, 247, 0.3);
    font-family: inherit;
  }

  .reset-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(168, 85, 247, 0.5);
  }

  .reset-btn:active { transform: translateY(0); }

  /* Confetti */
  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    top: -20px;
    z-index: 999;
    pointer-events: none;
    animation: fall 3s linear forwards;
  }

  @keyframes fall {
    to {
      transform: translateY(105vh) rotate(720deg);
      opacity: 0;
    }
  }

  /* Responsive */
  @media (max-height: 720px) {
    .game-container { padding: 20px 22px; }
    .title { font-size: 26px; }
    .subtitle { font-size: 12px; margin-bottom: 14px; }
    .score-value { font-size: 20px; }
    .score-box { padding: 8px 4px; }
    .pick-display { width: 70px; height: 70px; font-size: 32px; }
    .arena { padding: 12px 8px; margin-bottom: 16px; }
    .choice-btn { padding: 12px 6px; }
    .choice-btn .emoji { font-size: 28px; }
    .result-message { font-size: 14px; min-height: 45px; padding: 10px; margin-bottom: 12px; }
    .reset-btn { padding: 10px; font-size: 13px; }
  }

  @media (max-width: 480px) {
    .game-container { padding: 18px 14px; border-radius: 20px; }
    .title { font-size: 22px; }
    .pick-display { width: 60px; height: 60px; font-size: 26px; }
    .choice-btn .emoji { font-size: 24px; }
    .choice-btn .label { font-size: 10px; }
  }
</style>
</head>
<body>

<div class="game-container">
  <h1 class="title">✊✋✌️ Rock Paper Scissors</h1>
  <p class="subtitle">Apna move choose karo — computer ke against khelo!</p>

  <!-- Scoreboard -->
  <div class="scoreboard">
    <div class="score-box">
      <div class="score-label">You</div>
      <div class="score-value you" id="youScore">0</div>
    </div>
    <div class="score-box">
      <div class="score-label">Draws</div>
      <div class="score-value draw" id="drawScore">0</div>
    </div>
    <div class="score-box">
      <div class="score-label">Computer</div>
      <div class="score-value comp" id="compScore">0</div>
    </div>
  </div>

  <!-- Arena -->
  <div class="arena">
    <div class="pick-box">
      <div class="pick-label">You</div>
      <div class="pick-display" id="youPick">?</div>
    </div>
    <div class="vs">VS</div>
    <div class="pick-box">
      <div class="pick-label">Computer</div>
      <div class="pick-display" id="compPick">?</div>
    </div>
  </div>

  <!-- Result -->
  <div class="result-message" id="resultMsg">Apna move choose karo 👇</div>

  <!-- Choices -->
  <div class="choices" id="choices">
    <button class="choice-btn" data-choice="rock">
      <span class="emoji">✊</span>
      <span class="label">Rock</span>
    </button>
    <button class="choice-btn" data-choice="paper">
      <span class="emoji">✋</span>
      <span class="label">Paper</span>
    </button>
    <button class="choice-btn" data-choice="scissors">
      <span class="emoji">✌️</span>
      <span class="label">Scissors</span>
    </button>
  </div>

  <!-- Reset -->
  <button class="reset-btn" id="resetBtn">🔄 Reset Scores</button>
</div>

<script>
/* ---------- Config ---------- */
const CHOICES = {
  rock:     { emoji: '✊', name: 'Rock' },
  paper:    { emoji: '✋', name: 'Paper' },
  scissors: { emoji: '✌️', name: 'Scissors' }
};

const BEATS = {
  rock:     'scissors',
  paper:    'rock',
  scissors: 'paper'
};

/* ---------- State ---------- */
let youScore = 0;
let compScore = 0;
let drawScore = 0;
let isAnimating = false;

/* ---------- DOM ---------- */
const youScoreEl  = document.getElementById('youScore');
const compScoreEl = document.getElementById('compScore');
const drawScoreEl = document.getElementById('drawScore');
const youPickEl   = document.getElementById('youPick');
const compPickEl  = document.getElementById('compPick');
const resultMsg   = document.getElementById('resultMsg');
const choiceBtns  = document.querySelectorAll('.choice-btn');
const resetBtn    = document.getElementById('resetBtn');

/* ---------- Handle Choice ---------- */
function handleChoice(playerChoice) {
  if (isAnimating) return;
  isAnimating = true;
  disableChoices(true);

  // Reset visuals
  youPickEl.classList.remove('filled', 'win', 'lose');
  compPickEl.classList.remove('filled', 'win', 'lose');
  resultMsg.className = 'result-message';
  resultMsg.textContent = 'Computer soch raha hai... 🤔';

  // Show player choice immediately
  youPickEl.textContent = CHOICES[playerChoice].emoji;
  youPickEl.classList.add('filled');
  compPickEl.textContent = '❓';

  // Computer "thinking" animation
  const allEmojis = ['✊', '✋', '✌️'];
  let shuffleCount = 0;
  const shuffleInterval = setInterval(() => {
    compPickEl.textContent = allEmojis[shuffleCount % 3];
    shuffleCount++;
  }, 100);

  // After ~700ms decide computer choice
  setTimeout(() => {
    clearInterval(shuffleInterval);

    const choiceKeys = Object.keys(CHOICES);
    const compChoice = choiceKeys[Math.floor(Math.random() * 3)];

    compPickEl.textContent = CHOICES[compChoice].emoji;
    compPickEl.classList.add('filled');

    // Determine winner
    let result;
    if (playerChoice === compChoice) {
      result = 'draw';
      drawScore++;
      drawScoreEl.textContent = drawScore;
      resultMsg.textContent = `🤝 Draw! Dono ne ${CHOICES[playerChoice].name} choose kiya.`;
      resultMsg.className = 'result-message draw';
    } else if (BEATS[playerChoice] === compChoice) {
      result = 'win';
      youScore++;
      youScoreEl.textContent = youScore;
      youPickEl.classList.add('win');
      compPickEl.classList.add('lose');
      resultMsg.textContent = `🎉 Aap jeete! ${CHOICES[playerChoice].name} beats ${CHOICES[compChoice].name}`;
      resultMsg.className = 'result-message win';
      launchConfetti();
    } else {
      result = 'lose';
      compScore++;
      compScoreEl.textContent = compScore;
      youPickEl.classList.add('lose');
      compPickEl.classList.add('win');
      resultMsg.textContent = `😢 Computer jeeta! ${CHOICES[compChoice].name} beats ${CHOICES[playerChoice].name}`;
      resultMsg.className = 'result-message lose';
    }

    isAnimating = false;
    disableChoices(false);
  }, 700);
}

/* ---------- Helpers ---------- */
function disableChoices(state) {
  choiceBtns.forEach(btn => btn.disabled = state);
}

function launchConfetti() {
  const colors = ['#22d3ee', '#a855f7', '#f472b6', '#34d399', '#fbbf24', '#60a5fa'];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDelay = Math.random() * 0.4 + 's';
    c.style.animationDuration = (2 + Math.random() * 2) + 's';
    c.style.width = c.style.height = (6 + Math.random() * 8) + 'px';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

function resetGame() {
  youScore = 0;
  compScore = 0;
  drawScore = 0;
  youScoreEl.textContent = '0';
  compScoreEl.textContent = '0';
  drawScoreEl.textContent = '0';

  youPickEl.textContent = '?';
  compPickEl.textContent = '?';
  youPickEl.classList.remove('filled', 'win', 'lose');
  compPickEl.classList.remove('filled', 'win', 'lose');

  resultMsg.textContent = 'Apna move choose karo 👇';
  resultMsg.className = 'result-message';
}

/* ---------- Event Listeners ---------- */
choiceBtns.forEach(btn => {
  btn.addEventListener('click', () => handleChoice(btn.dataset.choice));
});

resetBtn.addEventListener('click', resetGame);

/* ---------- Keyboard shortcuts ---------- */
document.addEventListener('keydown', (e) => {
  if (isAnimating) return;
  if (e.key === '1' || e.key.toLowerCase() === 'r') handleChoice('rock');
  if (e.key === '2' || e.key.toLowerCase() === 'p') handleChoice('paper');
  if (e.key === '3' || e.key.toLowerCase() === 's') handleChoice('scissors');
});
</script>

</body>
</html>
